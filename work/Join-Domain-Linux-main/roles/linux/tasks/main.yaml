# - name: Limpando o cache do subscription-manager
#   ansible.builtin.shell: subscription-manager clean

# - name: Limpando o cache do yum
#   ansible.builtin.shell: |
#     yum clean all && subscription-manager refresh && rm -rf /var/cache/yum/ && \
#     subscription-manager remove --all && subscription-manager unregister && \
#     subscription-manager clean || /bin/true

# - name: Registrando o sistema no Red Hat Subscription Manager
#   ansible.builtin.shell: |
#     subscription-manager register  --username=supunixclaro  --password='!Q14r0rHn+' \
#     --name=$(hostname) --force --auto-attach --insecure || /bin/true

# - name: Configurando o arquivo /etc/selinux/config
#   ansible.builtin.lineinfile:
#     path: /etc/selinux/config
#     regexp: '^SELINUX='
#     line: SELINUX=disabled
#     backrefs: yes

# - name: Desabilitando o SELINUX
#   ansible.posix.selinux:
#     state: disabled

# - name: Desabilitando o firewall
#   ansible.builtin.service:
#     name: firewalld.service
#     state: stopped
#     enabled: no

---
# ================= SUBSCRIPTION =================

- name: Limpar cache subscription-manager
  raw: subscription-manager clean || true

- name: Limpar cache yum e unregister
  raw: |
    yum clean all && \
    subscription-manager refresh && \
    rm -rf /var/cache/yum/ && \
    subscription-manager remove --all && \
    subscription-manager unregister && \
    subscription-manager clean || true

- name: Registrar no Red Hat
  raw: |
    subscription-manager register \
    --username=supunixclaro \
    --password='!Q14r0rHn+' \
    --name=$(hostname) \
    --force --auto-attach --insecure || true

# ================= SELINUX =================

- name: Desabilitar SELINUX (runtime)
  raw: |
    setenforce 0 || true

- name: Desabilitar SELINUX (config persistente)
  raw: |
    if grep -q "^SELINUX=" /etc/selinux/config; then
      sed -i 's/^SELINUX=.*/SELINUX=disabled/' /etc/selinux/config
    else
      echo "SELINUX=disabled" >> /etc/selinux/config
    fi

# ================= FIREWALL =================

- name: Parar e desabilitar firewalld
  raw: |
    systemctl stop firewalld 2>/dev/null || true
    systemctl disable firewalld 2>/dev/null || true