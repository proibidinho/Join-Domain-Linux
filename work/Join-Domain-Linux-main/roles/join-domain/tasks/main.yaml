---
- name: Instalar pacotes base
  raw: |
    if command -v dnf >/dev/null 2>&1; then
      dnf install -y authconfig python3-pip
    else
      yum install -y authconfig python3-pip
    fi

- name: Instalar pacotes AD
  raw: |
    if command -v dnf >/dev/null 2>&1; then
      dnf install -y realmd sssd oddjob oddjob-mkhomedir adcli samba-common samba-common-tools krb5-workstation
    else
      yum install -y realmd sssd oddjob oddjob-mkhomedir adcli samba-common samba-common-tools krb5-workstation
    fi

# ================= CYBERARK =================

- name: Obter credenciais CyberArk
  set_fact:
    cyberark_creds: "{{ lookup('cyberark_claro') }}"
  delegate_to: localhost

# ================= CHECK DOMAIN =================

- name: Verificar domínio atual
  raw: realm list | grep -i "{{ ad_domain }}"
  register: domain_check
  failed_when: false
  changed_when: false

# ================= JOIN =================

- name: Join no domínio (retry)
  raw: |
    echo "{{ cyberark_creds.Content }}" | /usr/sbin/adcli join \
    --domain={{ ad_domain }} \
    --domain-controller={{ ad_dc }} \
    --login-user={{ cyberark_creds.UserName }} \
    --stdin-password
  register: join_result
  retries: 3
  delay: 15
  until: join_result.rc == 0
  when: domain_check.rc != 0

- name: Aguardar replicação do AD
  pause:
    seconds: 15

# ================= CONFIG FILES (SEM PYTHON) =================

- name: Subir krb5.conf
  raw: |
    cat << 'EOF' > /etc/krb5.conf
    {{ lookup('template', 'krb5.conf.j2') }}
    EOF

- name: Subir password-auth-ac
  raw: |
    cat << 'EOF' > /etc/pam.d/password-auth-ac
    {{ lookup('template', 'password-auth-ac.claro') }}
    EOF

- name: Subir sshd_config
  raw: |
    cat << 'EOF' > /etc/ssh/sshd_config
    {{ lookup('template', 'sshd_config.j2') }}
    EOF

- name: Subir sssd.conf
  raw: |
    cat << 'EOF' > /etc/sssd/sssd.conf
    {{ lookup('template', 'sssd.conf.claro') }}
    EOF

- name: Ajustar permissão sssd.conf
  raw: chmod 600 /etc/sssd/sssd.conf

# ================= SUDOERS (VALIDAÇÃO SEGURA) =================

- name: Gerar sudoers temporário
  raw: |
    cat << 'EOF' > /tmp/sudoers.test
    {{ lookup('template', 'sudoers.j2') }}
    EOF

- name: Validar sudoers
  raw: visudo -c -f /tmp/sudoers.test
  register: sudo_check

- name: Aplicar sudoers se válido
  raw: cp /tmp/sudoers.test /etc/sudoers
  when: sudo_check.rc == 0

# ================= PAM =================

- name: Subir system-auth-ac
  raw: |
    cat << 'EOF' > /etc/pam.d/system-auth-ac
    {{ lookup('template', 'system-auth-ac.claro') }}
    EOF

- name: Ativar sssd + mkhomedir
  raw: authselect select sssd with-mkhomedir --force

# ================= SERVICES =================

- name: Verificar status sssd
  raw: systemctl is-active sssd
  register: sssd_status
  failed_when: false
  changed_when: false

- name: Restart serviços se necessário
  raw: |
    systemctl enable realmd sssd oddjobd sshd || true
    systemctl restart realmd sssd oddjobd sshd || true
  when: sssd_status.stdout != "active"

- name: Aguardar replicação do AD
  pause:
    seconds: 15
    
# ================= TESTES =================

- name: Testar resolução do user AD
  raw: id "{{ test_user }}@{{ ad_domain }}"
  register: user_test
  retries: 3
  delay: 10
  until: user_test.rc == 0
  failed_when: user_test.rc != 0

- name: Testar autenticação do usuário
  raw: |
    echo "{{ test_password }}" | su - "{{ test_user }}@{{ ad_domain }}" -c "whoami"
  register: auth_test
  failed_when: auth_test.rc != 0
  when: test_password is defined

# ================= SUCESSO =================

- name: Sucesso no join AD e autenticação
  debug:
    msg: >-
      SUCESSO: Servidor integrado ao domínio {{ ad_domain }}
      | User {{ test_user }} validado (id + autentação OK)
  when:
    - user_test.rc == 0
    - auth_test.rc == 0