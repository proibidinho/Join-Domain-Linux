---
# ============================================================================
#  Projeto: Inserir Linux no domínio AD corp.clarobr
#
#  Fluxo:
#    1) Adiciona a VM ao inventory dinâmico (role: inventory)
#    2) Detecta o SO em cada host via `raw` (sem exigir Python no alvo)
#       e agrupa em linux_rhel8plus / linux_ol8plus / linux_unsupported
#    3) PRE-TASK: garante Python 3 instalado em todo host suportado
#       (role: bootstrap-python)
#    4) Executa o role apropriado para cada grupo
#
#  Suporta: RHEL 8/9 e Oracle Linux 8/9
#  NÃO suporta mais: RHEL 7 / Oracle Linux 7 (decisão do time)
# ============================================================================

- name: "Etapa 1 - Adicionar VMs ao inventory"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Incluir role inventory
      ansible.builtin.include_role:
        name: inventory

- name: "Etapa 2 - Detectar SO e agrupar hosts"
  hosts: unix
  gather_facts: false
  tasks:
    - name: Detectar SO
      ansible.builtin.import_role:
        name: detect-os

- name: "Etapa 3a - Configurar e join AD em RHEL 8/9 (com Satellite)"
  hosts: linux_rhel8plus
  gather_facts: false
  pre_tasks:
    - name: Garantir Python 3 instalado (pre-task)
      ansible.builtin.import_role:
        name: bootstrap-python
  tasks:
    - name: Executar role rhel8plus
      ansible.builtin.include_role:
        name: rhel8plus

- name: "Etapa 3b - Configurar e join AD em Oracle Linux 8/9 (sem Satellite)"
  hosts: linux_ol8plus
  gather_facts: false
  pre_tasks:
    - name: Garantir Python 3 instalado (pre-task)
      ansible.builtin.import_role:
        name: bootstrap-python
  tasks:
    - name: Executar role ol8plus
      ansible.builtin.include_role:
        name: ol8plus

- name: "Etapa 4 - Avisar SO não suportado"
  hosts: linux_unsupported
  gather_facts: false
  tasks:
    - name: Falhar para SO não suportado
      ansible.builtin.fail:
        msg: >-
          SO não suportado por este playbook em {{ inventory_hostname }}
          (esperado RHEL 8/9 ou Oracle Linux 8/9).
          os_id={{ os_id | default('?') }}
          os_major={{ os_major | default('?') }}
