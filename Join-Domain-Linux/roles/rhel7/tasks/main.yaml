---
# ============================================================================
#  ROLE: rhel7  (RHEL 7 - LEGADO - SOMENTE `raw`)
#  - Não assume Python no alvo
#  - sshd_config: NÃO substitui o arquivo. Remove apenas as diretivas AD
#    existentes (comentadas ou não) e adiciona um bloco delimitado no final.
#  - sudoers: NÃO toca /etc/sudoers. Cria drop-in /etc/sudoers.d/aap.
#  - password-auth-ac / system-auth-ac: o `authconfig` cuida automaticamente
#    (não escrevemos manualmente).
# ============================================================================

# =================== SUBSCRIPTION MANAGER (RHEL 7) ==========================
- name: "[RHEL7] Limpar subscription-manager"
  ansible.builtin.raw: subscription-manager clean || true
  changed_when: false

- name: "[RHEL7] Unregister + clean cache yum"
  ansible.builtin.raw: |
    yum clean all || true
    subscription-manager refresh || true
    rm -rf /var/cache/yum/ || true
    subscription-manager remove --all || true
    subscription-manager unregister || true
    subscription-manager clean || true
  changed_when: false

- name: "[RHEL7] Registrar no Red Hat (RHSM)"
  ansible.builtin.raw: |
    subscription-manager register \
      --username={{ rhsm_user | quote }} \
      --password={{ rhsm_pass | quote }} \
      --name=$(hostname) \
      --force --auto-attach --insecure
  register: rhsm_register
  retries: 3
  delay: 10
  until: rhsm_register.rc == 0
  no_log: true

# ============================ SELINUX =======================================
- name: "[RHEL7] SELinux runtime permissive"
  ansible.builtin.raw: setenforce 0 || true
  changed_when: false

- name: "[RHEL7] SELinux config persistente = disabled"
  ansible.builtin.raw: |
    if grep -q "^SELINUX=" /etc/selinux/config; then
      sed -i 's/^SELINUX=.*/SELINUX=disabled/' /etc/selinux/config
    else
      echo "SELINUX=disabled" >> /etc/selinux/config
    fi
  changed_when: true

# ============================ FIREWALL ======================================
- name: "[RHEL7] Parar e desabilitar firewalld"
  ansible.builtin.raw: |
    systemctl stop firewalld 2>/dev/null || true
    systemctl disable firewalld 2>/dev/null || true
  changed_when: false

# =========================== PACOTES AD =====================================
- name: "[RHEL7] Instalar pacotes realmd/sssd/adcli/authconfig"
  ansible.builtin.raw: |
    yum install -y realmd sssd sssd-tools oddjob oddjob-mkhomedir adcli \
      samba-common samba-common-tools krb5-workstation authconfig
  register: pkg_inst
  retries: 3
  delay: 10
  until: pkg_inst.rc == 0

# =========================== CYBERARK =======================================
- name: "[RHEL7] Obter credenciais CyberArk"
  ansible.builtin.set_fact:
    cyberark_creds: "{{ lookup('cyberark_claro') }}"
  delegate_to: localhost
  no_log: true

# ============== VERIFICA SE JÁ ESTÁ NO DOMÍNIO ==============================
- name: "[RHEL7] Verificar realm atual"
  ansible.builtin.raw: realm list 2>/dev/null | grep -i "{{ ad_domain }}" || true
  register: domain_check
  changed_when: false

# ============================= JOIN =========================================
- name: "[RHEL7] Remover keytab antigo se não estiver no domínio"
  ansible.builtin.raw: rm -f /etc/krb5.keytab
  when: domain_check.stdout | trim == ''
  changed_when: true

- name: "[RHEL7] Join no domínio (idempotente)"
  ansible.builtin.raw: |
    echo {{ cyberark_creds.Content | quote }} | /usr/sbin/adcli join \
      --domain={{ ad_domain }} \
      --domain-controller={{ ad_dc }} \
      --login-user={{ cyberark_creds.UserName | quote }} \
      --stdin-password
  register: join_result
  retries: 3
  delay: 15
  until: join_result.rc == 0
  when: domain_check.stdout | trim == ''
  no_log: true

- name: "[RHEL7] Aguardar replicação AD"
  ansible.builtin.pause:
    seconds: 15

- name: "[RHEL7] Validar que keytab foi criado"
  ansible.builtin.raw: test -s /etc/krb5.keytab
  register: keytab_check
  changed_when: false
  failed_when: keytab_check.rc != 0

# ====================== krb5.conf e sssd.conf (heredoc) =====================
# Estes 2 arquivos SÃO arquivos exclusivos do AD/SSSD e podem ser sobrescritos
# integralmente sem perder configurações de outras stacks.
- name: "[RHEL7] Renderizar /etc/krb5.conf"
  ansible.builtin.raw: |
    cat > /etc/krb5.conf << 'EOF_KRB5'
    {{ lookup('template', 'krb5.conf.j2') }}
    EOF_KRB5
    chmod 0644 /etc/krb5.conf
  changed_when: true

- name: "[RHEL7] Renderizar /etc/sssd/sssd.conf"
  ansible.builtin.raw: |
    install -d -m 0711 /etc/sssd
    cat > /etc/sssd/sssd.conf << 'EOF_SSSD'
    {{ lookup('template', 'sssd.conf.j2') }}
    EOF_SSSD
    chown root:root /etc/sssd/sssd.conf
    chmod 0600 /etc/sssd/sssd.conf
  changed_when: true

# ============== sshd_config: MERGE cirúrgico (preserva o resto) =============
# Estratégia:
#   1) Backup com timestamp
#   2) Remove TODAS as ocorrências (com e sem comentário) das diretivas que
#      vamos gerenciar - assim evitamos conflito de "first match wins"
#   3) Remove bloco antigo gerenciado pelo Ansible, se existir
#   4) Adiciona bloco delimitado no FIM do arquivo
#   5) Valida com sshd -t e só substitui se passar
- name: "[RHEL7] Aplicar bloco AD no sshd_config (merge sem substituir)"
  ansible.builtin.raw: |
    set -e
    SRC=/etc/ssh/sshd_config
    NEW=/etc/ssh/sshd_config.new
    cp -f "$SRC" "${SRC}.bkp.$(date +%s)"
    cp -f "$SRC" "$NEW"
    # 1) Remover diretivas gerenciadas (comentadas ou não)
    for k in PermitRootLogin PasswordAuthentication ChallengeResponseAuthentication \
             GSSAPIAuthentication GSSAPICleanupCredentials UsePAM PrintMotd AllowGroups; do
      sed -i -E "/^[[:space:]]*#?[[:space:]]*${k}([[:space:]]|$)/d" "$NEW"
    done
    # 2) Remover bloco antigo gerenciado
    sed -i '/# BEGIN ANSIBLE-AD/,/# END ANSIBLE-AD/d' "$NEW"
    # 3) Adicionar bloco novo no final
    cat >> "$NEW" << 'EOF_SSHD_AD'

    # BEGIN ANSIBLE-AD (gerenciado pelo playbook - NAO EDITAR MANUALMENTE)
    PermitRootLogin yes
    PasswordAuthentication yes
    ChallengeResponseAuthentication no
    GSSAPIAuthentication yes
    GSSAPICleanupCredentials no
    UsePAM yes
    PrintMotd no
    AllowGroups {{ sshd_allowgroups }}
    # END ANSIBLE-AD
    EOF_SSHD_AD
    # 4) Validar e aplicar
    /usr/sbin/sshd -t -f "$NEW"
    install -o root -g root -m 0600 "$NEW" "$SRC"
    rm -f "$NEW"
  register: sshd_merge
  changed_when: true
  failed_when: sshd_merge.rc != 0

- name: "[RHEL7] Validar config final do sshd (sshd -T)"
  ansible.builtin.raw: /usr/sbin/sshd -T >/dev/null
  register: sshd_T
  changed_when: false
  failed_when: sshd_T.rc != 0

# ============== sudoers: drop-in /etc/sudoers.d/aap (não toca /etc/sudoers) =
- name: "[RHEL7] Garantir includedir em /etc/sudoers"
  ansible.builtin.raw: |
    if ! grep -q "^#includedir /etc/sudoers.d" /etc/sudoers; then
      cp -f /etc/sudoers /etc/sudoers.bkp.$(date +%s)
      cp -f /etc/sudoers /tmp/sudoers.new
      echo "" >> /tmp/sudoers.new
      echo "#includedir /etc/sudoers.d" >> /tmp/sudoers.new
      visudo -c -f /tmp/sudoers.new && install -o root -g root -m 0440 /tmp/sudoers.new /etc/sudoers
      rm -f /tmp/sudoers.new
    fi
  changed_when: true

- name: "[RHEL7] Criar drop-in /etc/sudoers.d/aap"
  ansible.builtin.raw: |
    install -d -m 0750 -o root -g root /etc/sudoers.d
    cat > /tmp/sudoers.d.aap << 'EOF_SUDO_AAP'
    # Drop-in corporativo gerenciado pelo Ansible (role rhel7)
    Defaults!ALL    !visiblepw, always_set_home, match_group_by_gid, always_query_group_plugin
    svc_aap         ALL=(ALL)   NOPASSWD: ALL
    EOF_SUDO_AAP
    visudo -c -f /tmp/sudoers.d.aap
    install -o root -g root -m 0440 /tmp/sudoers.d.aap /etc/sudoers.d/aap
    rm -f /tmp/sudoers.d.aap
  register: sudo_dropin
  changed_when: true
  failed_when: sudo_dropin.rc != 0

# ====================== authconfig + restart serviços =======================
# authconfig gera/atualiza /etc/pam.d/{password,system}-auth-ac automaticamente
- name: "[RHEL7] Habilitar sssd + mkhomedir via authconfig"
  ansible.builtin.raw: authconfig --enablesssd --enablesssdauth --enablemkhomedir --update
  changed_when: true

- name: "[RHEL7] Limpar cache SSSD antes do restart"
  ansible.builtin.raw: |
    systemctl stop sssd 2>/dev/null || service sssd stop 2>/dev/null || true
    rm -rf /var/lib/sss/db/* /var/lib/sss/mc/* 2>/dev/null || true
  changed_when: false

- name: "[RHEL7] Enable + start serviços"
  ansible.builtin.raw: |
    systemctl enable realmd sssd oddjobd sshd 2>/dev/null || chkconfig sssd on || true
    systemctl start sssd oddjobd 2>/dev/null || service sssd start || true
    systemctl reload sshd 2>/dev/null || service sshd reload || true
  changed_when: true

- name: "[RHEL7] Aguardar serviços estabilizarem"
  ansible.builtin.pause:
    seconds: 5

- name: "[RHEL7] Status do sssd"
  ansible.builtin.raw: |
    if systemctl is-active sssd >/dev/null 2>&1; then echo active
    elif service sssd status >/dev/null 2>&1; then echo active
    else echo failed
    fi
  register: sssd_status
  changed_when: false

- name: "[RHEL7] Falhar se sssd não estiver ativo"
  ansible.builtin.fail:
    msg: "sssd não está ativo em {{ inventory_hostname }}"
  when: "'active' not in (sssd_status.stdout | default(''))"

# =========================== VALIDAÇÕES AD ==================================
- name: "[RHEL7] realm list deve mostrar {{ ad_domain }}"
  ansible.builtin.raw: realm list | grep -i "{{ ad_domain }}"
  register: realm_after
  retries: 3
  delay: 10
  until: realm_after.rc == 0
  changed_when: false
  failed_when: realm_after.rc != 0

- name: "[RHEL7] kinit do usuário (ccache isolado)"
  ansible.builtin.raw: |
    export KRB5CCNAME=FILE:/tmp/krb5cc_ansible_$$
    kdestroy -A 2>/dev/null || true
    echo {{ test_password | quote }} | kinit {{ test_user }}@{{ ad_domain | upper }}
    rc=$?
    kdestroy 2>/dev/null || true
    exit $rc
  register: kinit_test
  changed_when: false
  failed_when: kinit_test.rc != 0
  no_log: true
  when: test_password is defined and (test_password | length) > 0

- name: "[RHEL7] getent passwd do usuário AD"
  ansible.builtin.raw: getent passwd "{{ test_user }}@{{ ad_domain }}"
  register: getent_test
  retries: 3
  delay: 10
  until: getent_test.rc == 0
  changed_when: false
  failed_when: getent_test.rc != 0

- name: "[RHEL7] id do usuário AD"
  ansible.builtin.raw: id "{{ test_user }}@{{ ad_domain }}"
  register: id_test
  changed_when: false
  failed_when: id_test.rc != 0

- name: "[RHEL7] SUCESSO"
  ansible.builtin.debug:
    msg: >-
      [RHEL7] {{ inventory_hostname }} integrado ao {{ ad_domain }}
      | usuário {{ test_user }} validado (kinit + getent + id OK)
